# Render Blueprint: free-tier deployment of the API and the web app (two Docker services).
# The database is NOT created here: Render's free Postgres expires after 30 days, so use a
# free Neon database instead and paste its connection string as DATABASE_URL.
# See docs/deployment.md. Treat this file as a starting point and check it in the dashboard.
services:
  - type: web
    name: dhaka-tesla-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Neon: postgres://...neon.tech/neondb?sslmode=require
        sync: false
      - key: JWT_SECRET          # generated by Render, never committed
        generateValue: true
      - key: SEED_ON_START       # loads the demo cast so evaluators can sign in
        value: "true"

  - type: web
    name: dhaka-tesla-web
    runtime: docker
    plan: free
    rootDir: web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: API_URL             # public URL of the API service, e.g. https://dhaka-tesla-api.onrender.com
        sync: false
