name: ci

on:
  push:
    branches: [master, pre-release, 'release/**', 'feature/**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # Tests need a real Postgres: row locks and constraints cannot be proven with mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla
          POSTGRES_DB: dhaka_tesla_pool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d dhaka_tesla_pool_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://tesla:tesla@localhost:5432/dhaka_tesla_pool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
